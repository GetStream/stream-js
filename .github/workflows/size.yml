name: Compressed Size

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'test/**'
      - '**.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          build-script: 'dist'
